name: Windows Companion

on:
  push:
    branches: [ "main", "cursor/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PicoCompanion.sln

      - name: Build
        run: dotnet build .\PicoCompanion.sln -c Release --no-restore
